<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index - FolioOne Bootstrap Template</title>
    <!-- Vendor CSS Files -->
    <link
      href="assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />
    <link
      href="assets/vendor/glightbox/css/glightbox.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/FolioOne/assets/css/style.css" />
  </head>
  <body class="index-page">
    <main class="main">
      <!-- Hero Section -->
      <section id="hero" class="hero section">
        <div class="container" data-aos="fade-up" data-aos-delay="100">
          <div class="row gy-4 align-items-center">
            <div class="col-lg-6 order-2 order-lg-1">
              <div class="hero-content">
                <h1 data-aos="fade-up" data-aos-delay="200">
                  Hello, I'm <span class="highlight">Brandon Johnson</span>
                </h1>
                <h2 data-aos="fade-up" data-aos-delay="300">
                  Creative
                  <span
                    class="typed"
                    data-typed-items="UI/UX Designer, Web Developer, Digital Artist, Brand Strategist"
                  ></span>
                </h2>
                <p data-aos="fade-up" data-aos-delay="400">
                  Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed
                  do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                  Ut enim ad minim veniam, quis nostrud exercitation ullamco
                  laboris nisi ut aliquip ex ea commodo consequat.
                </p>
                <div
                  class="hero-actions"
                  data-aos="fade-up"
                  data-aos-delay="500"
                >
                  <a href="portfolio.html" class="btn btn-primary"
                    >View My Work</a
                  >
                  <a href="contact.html" class="btn btn-outline"
                    >Get In Touch</a
                  >
                </div>
              </div>
            </div>
            <div class="col-lg-6 order-1 order-lg-2">
              <div class="hero-image" data-aos="zoom-in" data-aos-delay="300">
                <div class="image-wrapper">
                  <img
                    src="/FolioOne/assets/img/profile-square-11.webp"
                    alt="Sarah Mitchell"
                    class="img-fluid"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- /Hero Section -->
    </main>

    <!-- Scroll Top -->
    <a
      href="#"
      id="scroll-top"
      class="scroll-top d-flex align-items-center justify-content-center"
      ><i class="bi bi-arrow-up-short"></i
    ></a>
    <!-- Vendor JS Files -->
    <script src="assets/vendor/aos/aos.js"></script>

    <!-- Main JS File -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
